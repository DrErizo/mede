[package]
authors = ["Erizo <erizo_dev@pm.me>"]
name = "mede"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/drerizo/mede"

[dependencies]
dioxus = { version = "0.7.9", features = ["router","desktop"]}
dioxus-desktop = "0.7.9"
# image = "0.25.6"
reqwest = "0.12.20"
rfd = "0.17.2"
tokio = { version = "1.48", features = ["full"] }
youtube_dl = "0.10.0"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
lto = true
panic = "abort"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[build-dependencies]
ureq = { version = "2", features = ["native-tls"] }
